name: NYC ACRIS full universe
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly until done, then monthly refresh handled by phase reset
permissions:
  contents: write
jobs:
  acris:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas pyarrow
      - uses: actions/cache/restore@v4
        with:
          path: acris_cache
          key: acris-cache-${{ github.run_id }}
          restore-keys: acris-cache-
      - run: python3 nyc_acris_full.py 17000
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: acris_cache
          key: acris-cache-${{ github.run_id }}
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add site/props && (git commit -m "ACRIS full universe merge $(date -u +%F)" && git push) || echo "no props change"
          cd site && git init -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
