name: NYC ACRIS full history
on:
  workflow_dispatch:
  push:
    paths: [nyc_acris_full.py]
  schedule:
    - cron: '0 8 1 * *'   # monthly, when the city refreshes ACRIS open data
permissions:
  contents: write
jobs:
  acris:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python3 nyc_acris_full.py
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add site/props && (git commit -m "ACRIS full history $(date -u +%F)" && git push) || echo "no changes"
          cd site && git init -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
