name: Texas (Harris, Dallas)
on:
  workflow_dispatch:
  push:
    paths: [tx_universe.py]
  schedule:
    - cron: '0 16 * * 1'
concurrency:
  group: tx
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ct:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - run: python3 tx_universe.py
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add data.json site tx_geo.json && git commit -m "Texas universe $(date -u +%F)" || echo "no changes"; for i in 1 2 3 4 5 6; do git pull --rebase -X theirs && git push && break || sleep 20; done
          for i in 1 2 3; do rm -rf /tmp/pub && cp -r site /tmp/pub && (cd /tmp/pub && git init -q -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages) && break || sleep 15; done; true
