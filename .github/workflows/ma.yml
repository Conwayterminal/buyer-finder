name: Massachusetts statewide
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'   # weekly
permissions:
  contents: write
jobs:
  ma:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 ma_build.py
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add data.json site && git commit -m "Massachusetts $(date -u +%F)" && git pull --rebase -X theirs && git push || echo "no changes"
          cd site && git init -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
