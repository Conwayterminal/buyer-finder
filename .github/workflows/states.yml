name: Statewide parcel adapter
on:
  workflow_dispatch:
  push:
    paths: [states.json, state_adapter.py]
  schedule:
    - cron: '0 20 * * 6'
concurrency:
  group: states
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build every state in states.json
        run: |
          for st in $(python3 -c "import json;print(' '.join(json.load(open('states.json')).keys()))"); do python3 state_adapter.py $st || echo "FAILED $st"; done
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add site && git commit -m "States $(date -u +%F)" || echo "no changes"; for i in 1 2 3 4 5 6; do git -c merge.renames=false -c diff.renames=false pull --rebase -X theirs && git push && break || sleep 20; done
          for i in 1 2 3; do rm -rf /tmp/pub && cp -r site /tmp/pub && (cd /tmp/pub && git init -q -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages) && break || sleep 15; done; true
