name: New Jersey statewide
on:
  workflow_dispatch:
  push:
    paths: [nj_universe.py]
  schedule:
    - cron: '0 13 * * 1'
concurrency:
  group: nj
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ct:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - run: python3 nj_universe.py
      - run: |
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add data.json site && git commit -m "New Jersey universe $(date -u +%F)" && git pull --rebase -X theirs && git push || echo "no changes"
          cd site && git init -b gh-pages && git config user.name b && git config user.email b@b.co && git add -A && git commit -qm publish && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
