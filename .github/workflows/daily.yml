name: Daily refresh
on:
  schedule:
    - cron: '0 10 * * *'   # 6:00 am ET, every day incl. weekends
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Pull today's sales (PincusCo) and city records (ACRIS/PLUTO/HPD)
        run: |
          python3 pincus.py 1 || true
          python3 update.py --days 45 || true
      - name: Save data
        run: |
          git config user.name "buyer-finder-bot"
          git config user.email "bot@conwaypropertyadvisors.com"
          git add data.json site/index.html
          git commit -m "Daily refresh $(date -u +%F)" && git push || echo "no changes"
      - name: Publish site
        run: |
          cd site && touch .nojekyll && git init -b gh-pages
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add -A && git commit -qm "publish $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
