name: Daily refresh
on:
  schedule:
    - cron: '0 10 * * *'   # 6:00 am ET, every day incl. weekends
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: daily
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas numpy
      - name: Pull today's sales (PincusCo) and city records (ACRIS/PLUTO/HPD)
        run: |
          python3 pincus.py 1 || true
          python3 update.py --days 45 || true
          python3 dob_step.py 1200 || true
          python3 nyc_sales_from_props.py || true
      - name: Save data
        run: |
          git config user.name "buyer-finder-bot"
          git config user.email "bot@conwaypropertyadvisors.com"
          git add data.json site/index.html site/data dob_state.json nyc_bbls.json
          git commit -m "Daily refresh $(date -u +%F)" || echo "no changes"; for i in 1 2 3 4 5 6; do git -c merge.renames=false -c diff.renames=false pull --rebase -X theirs && git push && break || sleep 20; done
      - name: Publish site
        run: |
          cd site && touch .nojekyll && git init -b gh-pages
          git config user.name "buyer-finder-bot"; git config user.email "bot@conwaypropertyadvisors.com"
          git add -A && git commit -qm "publish $(date -u +%F)"
          for i in 1 2 3 4 5; do git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages && break || sleep $((i*20)); done
